# Profile "h2": runs the API on an in-memory database so you can try it before SQL Server is set up.
# Data is lost every time the server stops. Start with:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:snapandpack;MODE=MSSQLServer;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
