# ---- Server ----
server.port=${PORT:8080}

# ---- Website ----
# The backend also serves the website, so http://localhost:8080 opens the store
# (run.bat picks the next free port if 8080 is taken).
# It reads the frontend folder straight from disk when it can find it (so edits show on refresh),
# and otherwise uses the copy packed inside the jar by the build.
spring.web.resources.static-locations=file:../frontend/,file:./frontend/,classpath:/static/

# ---- Microsoft SQL Server ----
# Run the scripts in /database first. Set DB_USERNAME and DB_PASSWORD as environment
# variables in your IDE's run configuration, or replace the defaults below on your own machine.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SnapAndPack;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Tables come from /database/02_schema.sql, so Hibernate does not create or change them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---- Sign-in tokens ----
# Use a long random value (at least 32 characters) and keep it private.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-going-live-0123456789}
app.jwt.hours-valid=8

# ---- First admin account ----
# Created on startup only when the database has no admin yet. Change the password after first sign-in.
app.admin.name=${ADMIN_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:admin@snapandpack.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

# ---- Front end addresses allowed to call this API (Live Server uses port 5500) ----
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*
