# ---- Server ----
server.port=${PORT:8080}

# ---- Website ----
# The backend also serves the website, so http://localhost:8080 opens the store
# (run.bat picks the next free port if 8080 is taken).
# It reads the frontend folder straight from disk when it can find it (so edits show on refresh),
# and otherwise uses the copy packed inside the jar by the build.
spring.web.resources.static-locations=file:../frontend/,file:./frontend/,classpath:/static/

# ---- Microsoft SQL Server ----
# Run the scripts in /database first. Set DB_USERNAME and DB_PASSWORD as environment
# variables in your IDE's run configuration, or replace the defaults below on your own machine.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SnapAndPack;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# encrypt=true means the connection to SQL Server is encrypted. trustServerCertificate=true accepts
# the server's self-made certificate, which is fine for testing on one computer.
# BEFORE GOING LIVE: install a real certificate on SQL Server and set trustServerCertificate=false in DB_URL.

# Tables come from the scripts in /database, so Hibernate does not create or change them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---- Sign-in tokens ----
# Use a long random value (at least 32 characters) and keep it private.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-going-live-0123456789}
app.jwt.hours-valid=8

# ---- First super admin account ----
# Created on startup only when the database has no super admin yet. Change the password after first sign-in.
app.admin.name=${ADMIN_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:admin@snapandpack.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

# ---- Front end addresses allowed to call this API (Live Server uses port 5500) ----
# BEFORE GOING LIVE: replace with the site's own address only, for example https://www.yourshop.co.ke
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ---- Sign-in cookie ----
# BEFORE GOING LIVE: set COOKIES_SECURE=true so the sign-in cookie is only ever sent over HTTPS.
# It stays false for testing on http://localhost, where there is no HTTPS.
app.cookies.secure=${COOKIES_SECURE:false}

# ---- Limits that slow down abuse ----
# Requests one address may make per minute: to sign-in/register/password reset, and to the whole API.
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH:20}
app.rate-limit.api-per-minute=${RATE_LIMIT_API:600}
# Largest JSON request body accepted, in bytes.
app.max-json-body-bytes=65536
# Behind Nginx or another reverse proxy, uncomment so the visitor's real address and HTTPS are seen:
# server.forward-headers-strategy=native

# ---- Product photo uploads ----
# Kept in a folder of their own, outside the program. JPEG and PNG only.
app.upload-dir=${UPLOAD_DIR:../uploads}
app.upload-max-bytes=2097152
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ---- Messages to users ----
# Every message is also written to the server log while testing. Set to false on the live site.
app.notifications.log=${NOTIFICATIONS_LOG:true}

# Email. See EmailNotifier.java for the steps. Fill these in and set app.mail.enabled=true.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@example.com}
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-mailbox@example.com
# spring.mail.password=${MAIL_PASSWORD:}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# SMS and WhatsApp are placeholders. See SmsNotifier.java and WhatsAppNotifier.java.
app.sms.enabled=false
app.whatsapp.enabled=false

# ---- M-Pesa (Safaricom Daraja) ----
# simulate = test mode: no request reaches Safaricom, no money moves, payments confirm themselves.
# live     = real requests to Safaricom. See DarajaMpesaGateway.java for the steps.
# Keep every value below in environment variables. Never write the secret, passkey or keys into this file.
app.mpesa.mode=${MPESA_MODE:simulate}
app.mpesa.simulate-auto-confirm=${MPESA_SIMULATE_AUTO_CONFIRM:true}
app.mpesa.base-url=${MPESA_BASE_URL:https://sandbox.safaricom.co.ke}
app.mpesa.consumer-key=${MPESA_CONSUMER_KEY:}
app.mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:}
app.mpesa.shortcode=${MPESA_SHORTCODE:}
app.mpesa.passkey=${MPESA_PASSKEY:}
app.mpesa.transaction-type=${MPESA_TRANSACTION_TYPE:CustomerPayBillOnline}
# Part of the address Safaricom reports payments to. Use a long random text. Empty = reports are refused.
app.mpesa.callback-secret=${MPESA_CALLBACK_SECRET:}

# ---- Public address of the site ----
# Used in password reset links. Leave empty to use the address the request came in on.
# Set it once the site has a real address, for example https://www.snapandpack.co.ke
app.public-url=${PUBLIC_URL:}
