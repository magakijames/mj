<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password – Snap &amp; Pack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/store.css">
</head>
<body>
  <div id="siteHeader"></div>

  <main class="wrap narrow">
    <div class="panel">
      <h1>Choose a new password</h1>
      <form id="resetForm" class="form">
        <label>New password <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
          <small>At least 8 characters, with a letter and a number.</small></label>
        <label>New password again <input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
        <p class="err" id="formError" role="alert"></p>
        <button class="btn">Save new password</button>
      </form>
      <p class="note" id="missing" hidden>This page needs a reset link. Ask for one on the <a href="forgot-password.html">forgot password</a> page.</p>
      <p class="swap"><a href="login.html">Back to sign in</a></p>
    </div>
  </main>

  <div id="siteFooter"></div>
  <script type="module" src="../assets/js/pages/reset-password.js"></script>
</body>
</html>
