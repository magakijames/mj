<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account – Snap &amp; Pack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/store.css">
</head>
<body>
  <div id="siteHeader"></div>

  <main class="wrap narrow">
    <div class="panel">
      <h1>Create account</h1>
      <form id="registerForm" class="form">
        <label>Full name <input id="name" autocomplete="name" maxlength="100" required></label>
        <label>Email <input id="email" type="email" autocomplete="email" required></label>
        <label>Password <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
          <small>At least 8 characters, with a letter and a number.</small></label>
        <p class="err" id="formError" role="alert"></p>
        <button class="btn">Create account</button>
      </form>
      <p class="swap">Already have an account? <a id="loginLink" href="login.html">Sign in</a></p>
    </div>
  </main>

  <div id="siteFooter"></div>
  <script type="module" src="../assets/js/pages/register.js"></script>
</body>
</html>
