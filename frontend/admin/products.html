<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products – Snap &amp; Pack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div id="adminHeader"></div>

  <main class="wrap">
    <div class="page-head">
      <div><h1 class="page-title">Products</h1><p class="meta" id="productCount"></p></div>
      <button class="btn" id="addProduct">Add product</button>
    </div>
    <div class="scroll" id="productTable"><p class="empty">Loading products…</p></div>
  </main>

  <div id="productModal" class="modal" hidden>
    <div class="box" role="dialog" aria-modal="true" aria-labelledby="formTitle">
      <h2 id="formTitle">Add product</h2>
      <form id="productForm" class="form">
        <label>Product name <input id="pName" maxlength="150" required></label>
        <div class="form-row">
          <label>Type <select id="pCategory"><option>Bag</option><option>Cap</option></select></label>
          <label>For <select id="pGender"><option>Men</option><option>Women</option><option>Unisex</option><option>Kids</option></select></label>
        </div>
        <label>Colours <input id="pColors" placeholder="Black, Navy, Beige" required><small>Separate with commas.</small></label>
        <label>Sizes <input id="pSizes" placeholder="S, M, L" required><small>Separate with commas.</small></label>
        <div class="form-row">
          <label>Price (KSh) <input id="pPrice" type="number" min="0" step="1" required></label>
          <label>Stock <input id="pStock" type="number" min="0" step="1" required></label>
        </div>
        <label>Photo <input id="pImage" maxlength="500" placeholder="assets/images/p12.jpg"><small>A path inside the site, or a full web address.</small></label>
        <p class="err" id="formError" role="alert"></p>
        <div class="btn-row end">
          <button type="button" class="btn ghost" data-close>Cancel</button>
          <button class="btn">Save product</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="../assets/js/admin/products.js"></script>
</body>
</html>
